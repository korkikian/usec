<section class="py-12 bg-gray-100">
    <div class="container mx-auto px-6">
        <h1 class="text-4xl font-bold text-center mb-8">Contact Us</h1>
        <p class="text-center text-lg mb-12">
        We’d love to hear from you! Fill out the form below and we'll get back to you as soon as possible.
        </p>
        <div class="max-w-xl mx-auto">
        <form action="https://formspree.io/f/xqaplork" method="POST" class="space-y-6">
            <div>
            <label for="email" class="block text-gray-700">Your Email</label>
            <input type="email" name="email" id="email" placeholder="you@example.com" required class="w-full mt-1 border border-gray-300 p-2 rounded">
            </div>
            <div>
            <label for="message" class="block text-gray-700">Your Message</label>
            <textarea name="message" id="message" placeholder="Your message..." required rows="5" class="w-full mt-1 border border-gray-300 p-2 rounded"></textarea>
            </div>
            <!-- Add more fields here if needed -->
            <button type="submit" class="w-full bg-cyan-600 text-white py-2 rounded hover:bg-cyan-700 transition duration-300">
            Send
            </button>
        </form>
        </div>
    </div>
</section>
