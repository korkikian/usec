<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ site.description | default: 'Your site description goes here' }}">
  <title>{{ page.title | default: site.title }}</title>
  
  <!-- Preconnect and load Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monda:wght@400;700&family=Red+Hat+Text:ital,wght@0,300;0,700;1,300;1,700&display=swap" rel="stylesheet">
  
  <!-- Main CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  
  <!-- Favicon -->
  <link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
</head>
<body>

  <header role="banner" class="bg-gray-800 text-white">
    {% include header.html %}
  </header>
  
  <main id="main-content" role="main" class="bg-gray-100 text-gray-800">
    {{ content }}
  </main>
  
  <footer role="contentinfo" class="bg-gray-800 text-white">
    {% include footer.html %}
  </footer>
  
  <!-- Main JS loaded at the end for performance -->
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
